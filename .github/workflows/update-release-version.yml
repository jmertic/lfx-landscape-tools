name: Update Release Version

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Get Release Metadata
        id: meta
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT
          
          # The SHA that was actually tagged for the release
          echo "SHA=$(git rev-parse ${{ github.event.release.tag_name }})" >> $GITHUB_OUTPUT
          
          # Debugging: This will show up in your Action logs so you can verify
          echo "Processing Version: $VERSION, SHA: $SHA"

      - name: Update pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.meta.outputs.VERSION }}\"/" pyproject.toml

      - name: Update README.md
        run: |
          # Matches: uses: jmertic/lfx-landscape-tools@[anything] # [anything]
          # Replaces with the new SHA and current date
          sed -i "s|uses: jmertic/lfx-landscape-tools@.* # .*|uses: jmertic/lfx-landscape-tools@${{ steps.meta.outputs.SHA }} # ${{ steps.meta.outputs.VERSION }}|" README.md

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: release ${{ steps.meta.outputs.VERSION }}"
          base: main # Explicitly target the protected branch
          branch: "release-updates-${{ steps.meta.outputs.VERSION }}"
          title: "Release Updates for ${{ steps.meta.outputs.VERSION }}"
          signoff: true
          body: |
            Automated version updates for release ${{ steps.meta.outputs.VERSION }}.
            - Updated pyproject.toml
            - Updated README.md SHA and Date
          labels: |
            automated-pr
            release
      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number != ''
        shell: bash
        run: |
          # Get the auto-merge setting using the full repository path
          ALLOW_MERGE=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')

          if [ "$ALLOW_MERGE" = "true" ]; then
            # Attempt auto-merge, fallback to immediate admin squash merge if auto-merge fails
            gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" \
            || gh pr merge --squash --admin "${{ steps.cpr.outputs.pull-request-number }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
