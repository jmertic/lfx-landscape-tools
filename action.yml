name: Update Landscape from LFX
description: Update the given landscape from LFX
inputs:
  project_processing:
    description: "Indicate for project processing, if they should be 'rebuild' or 'sync' ( or 'skip' to not build projects )"
    default: "sync"
  member_processing:
    description: "Indicate for member processing, if they should be 'build' or 'sync'"
    default: "build"
  configfile:
    description: "Filename for the config file ( defaults to config.yml )"
    default: "config.yml"
  logfile:
    description: "Filename for the log file ( defaults to debug.log )"
    default: "debug.log"
  datafile:
    description: "Filename for the data file ( defaults to landscape.yml )"
    default: "landscape.yml"
runs:
  using: composite
  steps:
    - name: Load App Token if set
      if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
      id: app_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ env.APP_ID }}
        private-key: ${{ env.APP_PRIVATE_KEY }}
    - name: Install cairo
      uses: gerlero/apt-install@f4fa5265092af9e750549565d28c99aec7189639 # v1.3.11
      with:
        packages: libcairo2-dev pkg-config python3-dev
    - name: Checkout landscape
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
      with:
        token: ${{ steps.app_token.outputs.token || env.token }}
        repository: ${{ env.repository }}
        ref: ${{ env.ref }}
    - name: Install lfx-landscape-tools via pipx
      shell: bash
      run: |
        # 1. Try the action reference (works for tags/branches)
        TARGET_VERSION="${{ github.action_ref }}"
        
        # 2. If blank, pull the folder name/SHA from the end of the action path
        if [ -z "$TARGET_VERSION" ] && [ -n "${{ github.action_path }}" ]; then
          TARGET_VERSION=$(basename "${{ github.action_path }}")
        fi
        
        # 3. Final fallback to main just in case
        if [ -z "$TARGET_VERSION" ]; then
          TARGET_VERSION="main"
        fi

        echo "Installing lfx-landscape-tools at version: $TARGET_VERSION"
        pipx install git+https://github.com/jmertic/lfx-landscape-tools.git@$TARGET_VERSION
    - name: Build members from LFX
      if: ${{ inputs.member_processing == 'build' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} build_members -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
    - name: Sync members from LFX
      if: ${{ inputs.member_processing == 'sync' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} sync_members -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
    - name: Rebuild projects from LFX and other sources
      if: ${{ inputs.project_processing == 'rebuild' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} build_projects -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
    - name: Sync projects from LFX and other sources
      if: ${{ inputs.project_processing == 'sync' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} sync_projects -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
    - name: Rebuild LFEU projects from LFX and other sources
      if: ${{ inputs.project_processing == 'lfeu' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} build_lfeuprojects -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
    - name: Save logfiles file
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.logfile }} 
        path: ./${{ inputs.logfile }}
        if-no-files-found: ignore
    - name: Validate landscape2 data
      uses: cncf/landscape2-validate-action@6381e8747c73412e638670807b402ef2b863e9f8 # v2.0.1
      with:
        target_kind: data
        target_path: ./${{ inputs.datafile }}
    - name: Get current date
      id: date
      uses: Kaven-Universe/github-action-current-date-time@7c1d8465d1bfd7d35466d2ee82a8e460780561ae # v1.5.0
      with:
        format: "YYYY-MM-DD"
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app_token.outputs.token || env.token }}
        branch-suffix: timestamp
        title: "Update Landscape from LFX ${{ steps.date.outputs.time }}"
        commit-message: Update Landscape from LFX
        signoff: true
    - name: Enable Pull Request Automerge
      if: steps.cpr.outputs.pull-request-number != ''
      shell: bash
      run: |
        if [ "$(gh api repos/${{ env.repository }} --jq '.allow_auto_merge')" = "true" ]; then
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" \
          || gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}"
        fi
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token || env.token }}
