name: Update Landscape from LFX
description: Update the given landscape from LFX
inputs:
  project_processing:
    description: "Indicate for project processing, if they should be 'rebuild' or 'sync' ( or 'skip' to not build projects )"
    default: "sync"
  member_processing:
    description: "Indicate for member processing, if they should be 'build' or 'sync'"
    default: "build"
  configfile:
    description: "Filename for the config file ( defaults to config.yml )"
    default: "config.yml"
  logfile:
    description: "Filename for the log file ( defaults to debug.log )"
    default: "debug.log"
  datafile:
    description: "Filename for the data file ( defaults to landscape.yml )"
    default: "landscape.yml"
runs:
  using: composite
  steps:
    - name: Install cairo
      uses: gerlero/apt-install@f4fa5265092af9e750549565d28c99aec7189639 # v1.3.11
      with:
        packages: libcairo2-dev pkg-config python3-dev
    - name: Checkout landscape
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.1.7
      with:
        token: ${{ env.token }}
        repository: ${{ env.repository }}
        ref: ${{ env.ref }}
        # Checked out directly to the root workspace
    - name: Install lfx-landscape-tools via pipx
      shell: bash
      run: |
        # 1. Try the action reference (works for tags/branches)
        TARGET_VERSION="${{ github.action_ref }}"
        
        # 2. If blank, try to extract the checked-out SHA of this action from its path
        if [ -z "$TARGET_VERSION" ] && [ -d "${{ github.action_path }}" ]; then
          TARGET_VERSION=$(echo "${{ github.action_path }}" | grep -oE '[0-9a-f]{40}$')
        fi
        
        # 3. Final fallback to main
        if [ -z "$TARGET_VERSION" ]; then
          TARGET_VERSION="main"
        fi

        echo "Installing lfx-landscape-tools at version: $TARGET_VERSION"
        pipx install git+https://github.com/jmertic/lfx-landscape-tools.git@$TARGET_VERSION
    - name: Build members from LFX
      if: ${{ inputs.member_processing == 'build' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} build_members -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ env.token }}
        GH_TOKEN: ${{ env.token }}
    - name: Sync members from LFX
      if: ${{ inputs.member_processing == 'sync' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} sync_members -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ env.token }}
        GH_TOKEN: ${{ env.token }}
    - name: Rebuild projects from LFX and other sources
      if: ${{ inputs.project_processing == 'rebuild' }}
      shell: bash
      run: lfx_landscape -s -l debug --logfile ${{ inputs.logfile }} build_projects -c ${{ inputs.configfile }}
      env:
        GITHUB_TOKEN: ${{ env.token }}
        GH_TOKEN: ${{ env.token }}
    - name: Sync projects from LFX and other sources
      if: ${{ inputs.project_processing == 'sync' }}
      shell: bash
      run: lfx_landscape -s
